
name: Terraform CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  terraform-check:
    name: Terraform Format, Validate and Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra

      - name: Initialize Terraform
        run: terraform -chdir=infra init -backend=false

      - name: Validate Terraform
        run: terraform -chdir=infra validate

      - name: Build Docker image
        run: docker build -t churn-api:local .

      - name: Scan Terraform configuration with Trivy
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            aquasec/trivy:0.65.0 config \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            /project/infra

      - name: Terraform Plan
        run: |
          terraform -chdir=infra plan \
            -input=false \
            -var="docker_host=unix:///var/run/docker.sock"
